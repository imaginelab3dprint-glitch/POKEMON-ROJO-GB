<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokemon - Edicion Roja (Spain) (SGB Enhanced)</title>
    <style>
        /* Esto elimina los bordes y pone el fondo negro para que parezca una app */
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- Aquí es donde aparecerá la pantalla del juego -->
    <div id="game-container"></div>

    <script>
        // Configuración del emulador
        EJS_player = '#game-container';
        
        // 'gb' es para Game Boy original. Si usas un juego de Color, cámbialo a 'gbc'
        EJS_core = 'gb'; 
        
        // Aquí pones el nombre EXACTO de tu archivo ROM que subiste a GitHub
        EJS_gameUrl = 'Pokemon - Edicion Roja (Spain) (SGB Enhanced).gb'; 
        

        EJS_startOnLoaded = true;
        
        // Esto carga el motor del emulador directamente desde los servidores de EmulatorJS
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>
</body>
</html>
